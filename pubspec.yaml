name: gaming_hub
description: GamingHub - Egypt's Gaming Center Reservation Platform

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Backend
  supabase_flutter: ^2.3.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  
  # UI & Styling
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  
  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^14.0.2
  
  # Image Handling
  image_picker: ^1.2.2
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  easy_localization: ^3.0.7
  http: ^1.2.0
  
  # UI Components
  flutter_svg: ^2.0.9
  qr_flutter: ^4.1.0
  flutter_dotenv: ^6.0.1
  cloudinary_flutter: ^1.3.0
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.7+1
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - .env

